name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # composer.lock pins Symfony 8.1, which requires PHP >= 8.4.1.
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Install and build front-end
        run: |
          npm ci
          npm run build

      - name: Check PHP formatting
        run: composer lint:check

      - name: Analyse PHP types
        run: composer types:check

      - name: Check front-end
        run: |
          npm run lint:check
          npm run format:check
          npm run types:check

      # The suite runs against SQLite in memory, configured in phpunit.xml,
      # so no database service is needed here.
      - name: Run tests
        run: php artisan test
